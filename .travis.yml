sudo: false

language: python

matrix:
  include:
    - python: 2.7
      env: ALLOW_FAILURE=true
      os:
        - linux
        - windows
    - python: 3.6
      env: ALLOW_FAILURE=false
      os:
        - linux
        - windows

  allow_failures:
    - python: 2.7
      env: ALLOW_FAILURE=true
  fast_finish: true

install:
  - pip install -qqq virtualenv
  - pip install -e .

script:
  - . build_in_travis.sh

notifications:
  email: false
