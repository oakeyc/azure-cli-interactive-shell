sudo: false

language: python

matrix:
  include:
    - python: 2.7
      env: ALLOW_FAILURE=true
    - python: 3.6
      env: ALLOW_FAILURE=false

  allow_failures:
    - python: 2.7
      env: ALLOW_FAILURE=true
  fast_finish: true

install:
  - pip install -qqq virtualenv
  - pip install -e .

script:
  - . build_in_travis.sh

notifications:
  email: false

os:
  - linux
  - windows
