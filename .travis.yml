sudo: false
language: python
python:
  - "2.7"
  - "3.6"
install:
  - pip install -qqq virtualenv
  - pip install -e .
env:
  global:
  - SECRET_VAR1=SECRET1
  matrix:
  - SECRET_VAR2=SECRET2
matrix:
  include:
    - python: 2.7
    - env: SECRET_VAR2=SECRET2
  allowed_failures:
    - python: "2.7"
    - env: SECRET_VAR2=SECRET2
script:
  - . build_in_travis.sh
notifications:
  email: false
os:
  - linux
  - windows
