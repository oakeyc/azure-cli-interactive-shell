sudo: false

language: python

# python:
#   - "2.7"
#   - "3.6"

env:
  - ALLOW_FAILURE=true
  - ALLOW_FAILURE=false

matrix:
  include:
    - python: 2.7
      env: ALLOW_FAILURE=true
    - python: 3.6
      env: ALLOW_FAILURE=false

  allowed_failures:
    # - python: 2.7
      - env: ALLOW_FAILURE=true
  fast_finish: true

install:
  - pip install -qqq virtualenv
  - pip install -e .

script:
  - . build_in_travis.sh

notifications:
  email: false

